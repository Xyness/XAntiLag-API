# Version
version: 2.1

# Update date
date: 25/11/2026

# Update notes
update-notes:
- "Needs XCore 2.0.1"
- "Mobs of different colours, variants, ages or gear no longer stack together"
- "Dye, bucket, food or shears on a stack only affect one mob, and animals can breed inside a stack"
- "New kill mode: one hit kills as many stacked mobs as its damage allows"
- "Stacked chickens lay as many eggs as there are chickens"
- "Kills on a stack count in statistics, and in quest and job plugins"
- "Stack labels can hide behind walls, have a view distance, and no more x1"
- "Leave a world out of a feature in one line, shulker boxes out of the tile limit, a sound or not for each clearlag warning"
- "Teleport button on staff alerts"
