plugins {
    id 'java-library'
    id 'maven-publish'
}

// The API has a version of its own, which is also the tag it is published under: 1.2.0 is the
// one XAntiLag 2.1 ships with. version.yml is the plugin's changelog, read by its update checker,
// and carries the plugin's version.
group = 'com.github.Xyness'
version = '1.2.0'

base { archivesName = 'XAntiLag-API' }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'XAntiLag-API'
            from components.java
        }
    }
}
